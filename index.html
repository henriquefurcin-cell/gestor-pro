function readAmount(t){let norm=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let words={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900};let token='(?:'+Object.keys(words).join('|')+'|mil|milhao|milhoes|e)';let amount='(?:\\d+(?:[.,]\\d+)*|'+token+'(?:\\s+'+token+')*)';function parse(v){if(/^\d/.test(v))return smartMoney(v);let total=0,n=0;for(let w of v.split(/\s+/)){if(w==='mil'){total+=(n||1)*1000;n=0}else if(w==='milhao'||w==='milhoes'){total+=(n||1)*1000000;n=0}else if(w!=='e')n+=words[w]||0}return total+n}let patterns=['(?:\\b(?:valor(?: total)?|preco(?: total)?|total|gastei|paguei|custou|custo|recebi|cobrei|comprei|vendi|preco do servico)\\s*(?:(?:de|e|foi|ficou|em)\\s+)*[:=]?\\s*(?:r\\$\\s*)?)('+amount+')\\b','r\\$\\s*('+amount+')\\b','\\b('+amount+')\\s+re(?:al|ais)\\b'];for(let pat of patterns){let m=norm.match(new RegExp(pat,'i'));if(m){let v=parse(m[1]);let c=norm.slice(m.index+m[0].length).match(new RegExp('^\\s*(?:reais?\\s*)?e\\s+('+amount+')\\s+centavos?\\b'));if(c)v+=parse(c[1])/100;if(v>0)return v}}let bare=norm.trim().match(new RegExp('^('+amount+')$'));return bare?parse(bare[1]):undefined}
function smartMoney(v){return Number(v.includes(',')?v.replace(/\./g,'').replace(',','.'): /^\d{1,3}(\.\d{3})+$/.test(v)?v.replace(/\./g,''):v)}
function smartService(t){let o={}, costs={material:'(?:materiais|material)',mao:'mão de obra',outros:'outros custos'};for(let [k,label] of Object.entries(costs)){let m=t.match(new RegExp('(?:custo de )?'+label+'\\s*[:=]?\\s*(?:R\\$\\s*)?(\\d[\\d.,]*)','i'));if(m)o[k]=smartMoney(m[1].replace(/[.,]$/,''))}let m=t.match(/\b(?:valor(?: total)?|preço(?: total)?|total)\s*(?:de|é|:|=)?\s*(?:R\$\s*)?(\d[\d.,]*)/i);if(!m){let all=[...t.matchAll(/R\$\s*(\d[\d.,]*)|\b(\d[\d.,]*)\s*reais\b/gi)];if(all.length===1&&!Object.keys(o).length)m=[all[0][0],all[0][1]||all[0][2]]}if(m)o.valor=smartMoney(m[1].replace(/[.,]$/,''));let d=t.match(/\b(?:entrega|prazo(?: de entrega)?)\s*(?:em|de|:)?\s*(\d{1,3})\s*dias\b(\s+após\s+[^,;.]+)?/i);if(d)o.prazo=d[2]?d[1]+' dias'+d[2]:Number(d[1]);let pay=t.match(/\b(?:pagamento|vencimento)\s*(?:em|de|:)?\s*(\d{1,3})\s*dias\b(\s+após\s+[^,;.]+)?/i);if(pay)o.pagamento=pay[2]?pay[1]+' dias'+pay[2]:Number(pay[1]);else if(/\bpagamento\s*[:]?\s*à vista/i.test(t))o.pagamento=0;let c=t.match(/\bcliente\s*:\s*([^,;\n]+)/i);if(c)o.cliente=c[1].trim();return o}
function smartBind(expense){let desc=$('desc');if(!desc)return;let tools=$('app').querySelector('.voice-tools');if(tools){for(let b of tools.querySelectorAll('button'))b.remove();if(!draftAudio)tools.hidden=true;}

// v5.16 — deterministic cost ledger: paid rows are immutable, pending rows equal the remaining commitment.
function costRows516(o,key,category){return db.fin.filter(f=>f.tipo==='pagar'&&f.serviceId===o.id&&(f.autoCost===key||(!f.autoCost&&f.category===category)));}
syncCosts=function(o){
 if(!o||o.status!=='Concluída')return;
 for(const [key,category] of [['material','Material'],['mao','Mão de obra'],['outros','Outros']]){
  const expected=cents(o[key]),detail=o.costDetails?.[key]||{},rows=costRows516(o,key,category);
  const paid=rows.filter(f=>f.pago),open=rows.filter(f=>!f.pago),paidTotal=paid.reduce((s,f)=>s+cents(f.valor),0);
  if(paidTotal>expected)throw Error('OS '+(o.numeroDoc||'')+' · '+category+': já foram pagos '+money(paidTotal/100)+', acima do custo de '+money(expected/100)+'. Corrija o custo ou revise o pagamento.');
  const date=detail.date||today(),method=detail.method||'Não informado';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Informe a data de '+category+'.');
  const remaining=expected-paidTotal;
  // A form checkbox cannot retroactively undo an actual payment. Nor can it duplicate it.
  const autoOpen=open.filter(f=>f.autoCost===key),manualOpen=open.filter(f=>f.autoCost!==key);
  const manualAmount=manualOpen.reduce((s,f)=>s+cents(f.valor),0);
  if(manualAmount>remaining)throw Error('OS '+(o.numeroDoc||'')+' · '+category+': lançamentos manuais pendentes excedem o custo restante. Confira no financeiro.');
  const autoNeeded=remaining-manualAmount;
  if(detail.paid&&remaining>0){
   if(date>today()||method==='Não informado')throw Error('Para pagar '+category+', informe data até hoje e forma de pagamento.');
   // Only the remaining automatic amount is eligible for payment via the OS form.
   if(manualOpen.length)throw Error('Há despesa manual pendente de '+category+'. Faça a baixa dela no Financeiro para evitar duplicidade.');
  }
  const primary=autoOpen[0];
  if(autoNeeded===0){for(const f of autoOpen)db.fin=db.fin.filter(z=>z.id!==f.id);continue;}
  const row=primary||{id:uid(),tipo:'pagar',serviceId:o.id,autoCost:key,category,quick:true};
  Object.assign(row,{titulo:category+' - OS '+(o.numeroDoc||'')+' - '+o.titulo,cliente:o.cliente,serviceTitle:o.titulo,desc:detail.desc||row.desc||'Custo de '+category.toLowerCase(),valor:autoNeeded/100,data:date});
  if(detail.paid){Object.assign(row,{pago:true,baixa:date,baixaAt:Date.now(),method});}
  else{Object.assign(row,{pago:false,baixa:null,baixaAt:null,method:'Não informado'});}
  if(!primary)db.fin.push(row);
  for(const extra of autoOpen.slice(1))db.fin=db.fin.filter(z=>z.id!==extra.id);
 }
};

// v5.26 — reconciliação determinística OS → Financeiro.
// Lançamentos pagos são preservados; somente lançamentos automáticos pendentes podem ser ajustados.
function reconcileLedger526(o){
 if(!o||o.status!=='Concluída')return;
 for(const [key,category] of [['material','Material'],['mao','Mão de obra'],['outros','Outros']]){
  const expected=cents(o[key]),detail=o.costDetails?.[key]||{};
  if(expected<0)throw Error('Custo negativo na OS '+(o.numeroDoc||'')+': '+category);
  const rows=db.fin.filter(f=>f.tipo==='pagar'&&f.serviceId===o.id&&(f.autoCost===key||(!f.autoCost&&f.category===category)));
  const paid=rows.filter(f=>f.pago),unpaid=rows.filter(f=>!f.pago);
  const paidAmount=paid.reduce((s,f)=>s+cents(f.valor),0);
  const manual=unpaid.filter(f=>f.autoCost!==key),manualAmount=manual.reduce((s,f)=>s+cents(f.valor),0);
  const auto=unpaid.filter(f=>f.autoCost===key);
  const balance=expected-paidAmount-manualAmount;
  if(balance<0)throw Error('OS '+(o.numeroDoc||'')+' · '+category+': gastos já lançados ('+money((paidAmount+manualAmount)/100)+') excedem o custo informado ('+money(expected/100)+'). Confira os registros; nada foi alterado.');
  const date=detail.date||today(),method=detail.method||'Não informado';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Data inválida em '+category+' da OS '+(o.numeroDoc||''));
  if(detail.paid&&balance>0&&(date>today()||method==='Não informado'))throw Error('Informe data de pagamento válida e forma de pagamento de '+category+'.');
  if(detail.paid&&balance>0&&manual.length)throw Error('OS '+(o.numeroDoc||'')+' · '+category+': existe despesa manual pendente. Quite pelo Financeiro para evitar duplicidade.');
  let primary=auto[0];
  if(balance===0){for(const f of auto)db.fin=db.fin.filter(z=>z.id!==f.id);continue;}
  if(!primary){primary={id:uid(),tipo:'pagar',serviceId:o.id,autoCost:key,category,quick:true};db.fin.push(primary);}
  Object.assign(primary,{titulo:category+' - OS '+(o.numeroDoc||'')+' - '+o.titulo,cliente:o.cliente,serviceTitle:o.titulo,desc:detail.desc||primary.desc||'Custo de '+category.toLowerCase(),valor:balance/100,data:date,category,autoCost:key,serviceId:o.id});
  if(detail.paid){Object.assign(primary,{pago:true,baixa:date,baixaAt:Date.now(),method});}
  else{Object.assign(primary,{pago:false,baixa:null,baixaAt:null,method:'Não informado'});}
  for(const f of auto.slice(1))db.fin=db.fin.filter(z=>z.id!==f.id);
 }
 const rec=linked(o),received=rec.filter(f=>f.pago).reduce((s,f)=>s+cents(f.valor),0),unpaid=rec.filter(f=>!f.pago),remaining=cents(o.valor)-received;

 if(!remaining){for(const f of unpaid)db.fin=db.fin.filter(z=>z.id!==f.id);}
 else{
  const f=unpaid[0]||{id:uid(),tipo:'receber',origem:o.id,pago:false};
  Object.assign(f,{tipo:'receber',origem:o.id,serviceId:o.id,category:'Serviço',titulo:o.titulo,cliente:o.cliente,valor:remaining/100,data:o.vencimento||f.data||dueDefault(),pago:false});

 }

}

// v5.27 — single-source cost reconciliation for ALL OS stages, with financial invariants.
// OS costs are planned liabilities from creation; receipts only arise after conclusion.
function ledgerCostRows527(o,key,category){return db.fin.filter(f=>f.tipo==='pagar'&&f.serviceId===o.id&&(f.autoCost===key||(!f.autoCost&&f.category===category)))}
function reconcileLedger527(o){
 if(!o)return;
 for(const [key,category] of [['material','Material'],['mao','Mão de obra'],['outros','Outros']]){
  const expected=cents(o[key]);if(!Number.isFinite(expected)||expected<0)throw Error('OS '+(o.numeroDoc||'')+': valor inválido em '+category);
  const detail=o.costDetails?.[key]||{},rows=ledgerCostRows527(o,key,category);
  const paid=rows.filter(f=>f.pago),manual=rows.filter(f=>!f.pago&&f.autoCost!==key),auto=rows.filter(f=>!f.pago&&f.autoCost===key);
  const locked=[...paid,...manual].reduce((a,f)=>a+cents(f.valor),0),remaining=expected-locked;
  if(remaining<0)throw Error('OS '+(o.numeroDoc||'')+' · '+category+': lançado '+money(locked/100)+' e previsto '+money(expected/100)+'. Ajuste os valores antes de salvar.');
  const date=detail.date||today(),method=detail.method||'Não informado';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Data inválida: '+category+' da OS '+(o.numeroDoc||''));
  if(detail.paid&&remaining>0&&manual.length)throw Error('OS '+(o.numeroDoc||'')+' · '+category+': há despesa manual pendente. Registre a baixa no Financeiro.');
  if(detail.paid&&remaining>0&&(date>today()||method==='Não informado'))throw Error('Informe a data efetiva e a forma de pagamento: '+category+'.');
  // Keep the first automatic open entry stable. Never modify a confirmed payment.
  const primary=auto[0];
  if(remaining===0){for(const f of auto)db.fin=db.fin.filter(z=>z.id!==f.id);continue;}
  const row=primary||{id:uid(),tipo:'pagar',serviceId:o.id,autoCost:key,category,quick:true};
  Object.assign(row,{titulo:category+' - OS '+(o.numeroDoc||'')+' - '+o.titulo,cliente:o.cliente,serviceTitle:o.titulo,desc:detail.desc||row.desc||'Custo de '+category.toLowerCase(),valor:remaining/100,data:date,serviceId:o.id,category,autoCost:key});
  if(detail.paid)Object.assign(row,{pago:true,baixa:date,baixaAt:Date.now(),method});
  else Object.assign(row,{pago:false,baixa:null,baixaAt:null,method:'Não informado'});
  if(!primary)db.fin.push(row);
  for(const extra of auto.slice(1))db.fin=db.fin.filter(z=>z.id!==extra.id);
 }
 // Receivables are generated only after the OS is concluded.
 if(o.status!=='Concluída'){
  if(linked(o).some(f=>f.pago))throw Error('OS '+(o.numeroDoc||'')+': possui recebimento confirmado; não é possível reabrir sem estornar.');
  db.fin=db.fin.filter(f=>!(f.tipo==='receber'&&f.origem===o.id&&!f.pago));
  o.recebidoOS=0;return;
 }
 const rows=linked(o),paid=rows.filter(f=>f.pago),unpaid=rows.filter(f=>!f.pago);
 const received=paid.reduce((a,f)=>a+cents(f.valor),0),remaining=cents(o.valor)-received;
 if(remaining<0)throw Error('OS '+(o.numeroDoc||'')+': recebido maior que valor total da OS.');
 if(unpaid.length>1)throw Error('OS '+(o.numeroDoc||'')+': mais de uma cobrança pendente. Conferir manualmente para não duplicar.');
 if(remaining===0){db.fin=db.fin.filter(f=>!(f.tipo==='receber'&&f.origem===o.id&&!f.pago));}
 else{
  const row=unpaid[0]||{id:uid(),tipo:'receber',origem:o.id,pago:false};
  Object.assign(row,{tipo:'receber',origem:o.id,serviceId:o.id,category:'Serviço',titulo:o.titulo,cliente:o.cliente,valor:remaining/100,data:o.vencimento||row.data||dueDefault(),pago:false});
  if(!unpaid.length)db.fin.push(row);
 }
 o.recebidoOS=received/100;
}

syncOS=function(o){reconcileLedger527(o)};
// Preserve the transactional nature of the existing save and settlement flows.
function auditLedger527(){
 const snapshot=JSON.stringify(db),issues=[],changes=[];
 for(const o of db.os){
  const before=JSON.stringify(db);
  try{
   reconcileLedger527(o);
   const after=JSON.stringify(db);
   if(before!==after)changes.push('OS '+(o.numeroDoc||o.id));
  }catch(e){db=JSON.parse(before);issues.push(e.message)}
 }
 try{
  const ids=new Set(db.os.map(o=>o.id));

  if(orphan.length)issues.push(orphan.length+' lançamento(s) vinculado(s) a OS inexistente.');
